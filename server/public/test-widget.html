<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velocity AI - Widget Presentation</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #f4f4f7;
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #1a1a1a;
        }

        .preview-box {
            background: white;
            padding: 40px;
            border-radius: 32px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 500px;
        }

        h1 { font-weight: 900; text-transform: uppercase; font-style: italic; letter-spacing: -0.02em; }
        p { color: #666; line-height: 1.6; }
        
        .badge {
            background: #3b82f6;
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 20px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="preview-box">
        <div class="badge">Success Environment</div>
        <h1>Order #911729813 Confirmed</h1>
        <p>This is a simulated Shopify "Thank You" page. In a real scenario, our script would detect the order ID and present the AI recommendation automatically.</p>
        <p style="font-size: 12px; color: #999;">Check the bottom right corner ↘️</p>
    </div>

    <!-- The Velocity AI Widget Script -->
    <script src="/widget.js"></script>
</body>
</html>
